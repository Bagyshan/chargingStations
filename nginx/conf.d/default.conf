# Reverse proxy + терминация TLS (#6).
#   :80  — ACME (Let's Encrypt HTTP-01) + OCPP станций по ws (редирект на wss их рвёт) + редирект остального на https.
#   :443 — TLS. HSTS. Все локейшены приложения.
#
# TLS в Kubernetes = то же самое делает Ingress + cert-manager: терминация на краю, внутрь трафик по HTTP.
# Приложения ходят по http между собой и не знают про TLS — переезд на Ingress их не затрагивает.
#
# Сертификат: certbot --cert-name charging → /etc/letsencrypt/live/charging/{fullchain,privkey}.pem
#   (фиксированное имя, поэтому в конфиге нет домена). Первый выпуск — nginx/init-letsencrypt.sh.
# Basic Auth (Consul/Kafka-UI) и правила локейшенов — как раньше.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ============================ :80 — ACME + OCPP + редирект на HTTPS ============================
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ACME HTTP-01 challenge (certbot webroot) — НЕ редиректим.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # OCPP станций по ws:// (зарядки подключаются из поля; 301 на wss рвёт WebSocket).
    # Оставляем plaintext ws на :80 до миграции станций на wss (OCPP 1.6-J over TLS) — отдельная задача.
    location /steve/websocket/ {
        set $up_steve app:8180;
        proxy_pass http://$up_steve;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
    location /steve/services/ {
        set $up_steve app:8180;
        proxy_pass http://$up_steve;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # Всё остальное (браузер/REST/мобилка) — на HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================ :443 — TLS ============================
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/charging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/charging/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS. Сначала без includeSubDomains/preload — включить, когда ВСЕ поддомены/клиенты на https.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 25m;

    # ---- Keycloak OIDC (ПУБЛИЧНО). X-Forwarded-Proto=https здесь → issuer токенов = https://<host>/realms/... ----
    location ~ ^/(realms|resources|js|robots\.txt) {
        set $up_keycloak keycloak:8080;
        proxy_pass http://$up_keycloak;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ---- Keycloak admin-консоль (защищена собственным master-login; Basic Auth несовместим — см. историю) ----
    location ^~ /admin {
        # allow 203.0.113.10;   # <- ваш office/VPN IP для defense-in-depth
        # deny  all;
        set $up_keycloak keycloak:8080;
        proxy_pass http://$up_keycloak;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # ---- SteVe: OCPP-эндпоинты станций (ПУБЛИЧНО) — здесь уже wss ----
    location /steve/websocket/ {
        set $up_steve app:8180;
        proxy_pass http://$up_steve;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
    location /steve/services/ {
        set $up_steve app:8180;
        proxy_pass http://$up_steve;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ---- SteVe manager (собственный form-login с $STEVE_AUTH_PASSWORD; Basic Auth несовместим) ----
    location /steve/ {
        # allow 203.0.113.10;   # <- ваш office/VPN IP
        # deny  all;
        set $up_steve app:8180;
        proxy_pass http://$up_steve;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Consul UI + API (ОГРАНИЧЕНО Basic Auth — своей авторизации нет) ----
    location /ui/ {
        auth_basic           "Restricted — ops";
        auth_basic_user_file /etc/nginx/.htpasswd;
        set $up_consul consul-server:8500;
        proxy_pass http://$up_consul;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /v1/ {
        auth_basic           "Restricted — ops";
        auth_basic_user_file /etc/nginx/.htpasswd;
        set $up_consul consul-server:8500;
        proxy_pass http://$up_consul;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Kafka-UI (ОГРАНИЧЕНО Basic Auth — своей авторизации нет) ----
    location /kafka/ {
        auth_basic           "Restricted — ops";
        auth_basic_user_file /etc/nginx/.htpasswd;
        set $up_kafkaui kafka-ui:8080;
        proxy_pass http://$up_kafkaui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Загруженные файлы станций (ПУБЛИЧНО) ----
    location /uploads/ {
        set $up_station_controll station-controll-service:8001;
        proxy_pass http://$up_station_controll;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Админ-панель BatEnergy (React SPA) — статика ----
    location = /console { return 301 /console/; }
    location /console/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /console/index.html;

        location ~* ^/console/assets/.+\.(?:js|css|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|ico)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }
        location = /console/index.html {
            add_header Cache-Control "no-cache";
        }
    }

    # ---- Всё остальное: API + WebSocket (wss) через api-gateway ----
    location / {
        set $up_gateway api-gateway-service:8010;
        proxy_pass http://$up_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
