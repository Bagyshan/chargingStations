# Codemagic CI — сборка iOS-приложения BatEnergy без Mac и выгрузка в TestFlight/App Store.
#
# Этот файл ДОЛЖЕН лежать в КОРНЕ репозитория (Codemagic ищет его тут).
# Само приложение — в подпапке chargingStationsMobile/batenergy_app (см. working_directory).
#
# ── Что настроить в Codemagic ПЕРЕД первым запуском ──
# 1) https://codemagic.io → зайти через GitHub → дать доступ к репозиторию Bagyshan/chargingStations.
# 2) Teams → Integrations → App Store Connect → добавить API-ключ:
#    загрузить файл .p8 + вписать Key ID и Issuer ID (берутся в App Store Connect →
#    Users and Access → Integrations → App Store Connect API). Задать ключу ИМЯ и
#    вписать это имя ниже в поле `app_store_connect:` (сейчас там "BatEnergy ASC key").
# 3) В App Store Connect создать приложение с bundle id com.batenergy.app (и зарегистрировать
#    этот же Identifier в developer.apple.com → Identifiers; если нужны пуши — включить там Push).
#
# После этого: в Codemagic выбрать workflow "ios-testflight" → Start new build.
# На выходе .ipa автоматически уедет в TestFlight — оттуда ставится на реальный iPhone.

workflows:
  ios-testflight:
    name: BatEnergy iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: chargingStationsMobile/batenergy_app
    integrations:
      # ↓↓↓ ВПИШИ имя интеграции App Store Connect, которое задал в Codemagic
      app_store_connect: BatEnergy ASC key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.batenergy.app
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing (Codemagic сам создаст сертификат и профиль)
        script: xcode-project use-profiles
      - name: Build signed IPA
        # Версия берётся из pubspec.yaml (1.0.0+1). Для следующих загрузок в TestFlight
        # ОБЯЗАТЕЛЬНО поднимай число после "+" в pubspec (build number должен расти).
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Выгружать в TestFlight (бета). Оставь true для тестов на iPhone.
        submit_to_testflight: true
        # Когда захочешь отправлять сразу на ревью в App Store — поставь true
        # (и заранее заполни карточку: скриншоты, описание, приватность, демо-аккаунт).
        # submit_to_app_store: false
